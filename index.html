<section id="games" class="page active"><div class="card"><h2>Spiel anlegen</h2><form id="gameForm" class="grid"><label>Datum<div class="date-wrap"><input class="date-display" type="text" placeholder="TT.MM.JJJJ" readonly><button type="button" class="date-btn">📅</button><input class="native-date" type="date" name="date" required></div></label><label>Gegner<input name="opponent" required></label><label>Ort<select name="venue"><option>Heim</option><option>Auswärts</option><option>Neutral</option></select></label><label>Spielart<select name="type"><option>Liga</option><option>Testspiel</option><option>Turnier</option><option>Pokal</option></select></label><label>Spieldauer<input type="number" name="duration" value="70" min="1" required></label><label>Tore VfR<input type="number" name="gf" value="0" min="0"></label><label>Gegentore<input type="number" name="ga" value="0" min="0"></label><div class="full actions"><button class="btn">Spiel speichern</button></div></form></div><div id="gameCards"></div></section>

d><tbody id="statsTable"></tbody></table></div></section>

<div id="playerModal" class="modal"><div class="modalbox"><h3>Spieler bearbeiten</h3><form id="editPlayerForm" class="grid"><input name="id" type="hidden"><label>Nr.<input name="nr" type="number" required></label><label>Vorname<input name="first" required></label><label>Nachname<input name="last"></label><label>Position<input name="position"></label><label>Status<select name="active"><option value="true">Aktiv</option><option value="false">Inaktiv</option></select></label><label><input name="goalkeeper" type="checkbox" style="width:auto"> Torwart</label><div class="full actions"><button class="btn green">Übernehmen</button><button type="button" id="cancelPlayerEdit" class="btn gray">Abbrechen</button></div></form></div></div>
<div id="gameModal" class="modal"><div class="modalbox"><h3>Spiel bearbeiten</h3><form id="editGameForm" class="grid"><input name="id" type="hidden"><label>Datum<div class="date-wrap"><input class="date-display" type="text" placeholder="TT.MM.JJJJ" readonly><button type="button" class="date-btn">📅</button><input class="native-date" name="date" type="date" required></div></label><label>Gegner<input name="opponent" required></label><label>Ort<select name="venue"><option>Heim</option><option>Auswärts</option><option>Neutral</option></select></label><label>Spielart<select name="type"><option>Liga</option><option>Testspiel</option><option>Turnier</option><option>Pokal</option></select></label><label>Spieldauer<input name="duration" type="number" min="1"></label><label>Tore VfR<input name="gf" type="number" min="0"></label><label>Gegentore<input name="ga" type="number" min="0"></label><div class="full actions"><button class="btn green">Übernehmen</button><button type="button" id="cancelGameEdit" class="btn gray">Abbrechen</button></div></form></div></div>
<script>'use strict';const $=id=>document.getElementById(id),baseComp=['Oberliga Baden-Württemberg','Verbandspokal','Bezirkspokal','Turnier','Testspiel','Sonstiges'];const raw=[['Nico','Lautenbach',1,'TW',1],['Dominik','Wojtysiak',12,'',0],['Kristian','Wagner',22,'TW',1],['Raphael','Alvelos',2,'',0],['Maik','Tatou',3,'',0],['Mats','Weinreuther',4,'IV',0],['Dino','Hasic',5,'ZM/IV',0],['Tan','Turhan',6,'RV/ZM',0],['David','Vasiljevic',7,'LF',0],['Arda','Budak',8,'RF',0],['Antonio','Sica',9,'MS',0],['Luis','Zimmermann',10,'ZM',0],['Berkay','',11,'ZM',0],['Lasisi','Victor',13,'MS',0],['Luca','',14,'ZM',0],['Tuna','Seklem',15,'LV',0],['Kelvin','Rohleder',16,'ZM',0],['Erdem','Uzunok',17,'',0],['Eric','Serjanaj',18,'ZM',0],['Leo','Llukaci',19,'MS',0],['Viktor','Averkin',20,'IV',0],['Semin','Hasic',21,'',0],['Burak','Korkmaz',23,'',0],['Lenny','Detaro',24,'',0]];const seed=raw.map((x,i)=>({id:'SP'+String(i+1).padStart(3,'0'),first:x[0],last:x[1],nr:x[2],position:x[3],goalkeeper:!!x[4],active:true}));let db=JSON.parse(localStorage.getItem('u15-v7')||'null')||{players:seed,games:[],records:[],competitions:[]};db.competitions=db.competitions||[];db.live=db.live||{};let current='',liveTimer=null,selField='',selBench='';const isoToEu=v=>{if(!/^\d{4}-\d{2}-\d{2}$/.test(v||''))return v||'';const [y,m,d]=v.split('-');return `${d}.${m}.${y}`},persist=()=>localStorage.setItem('u15-v7',JSON.stringify(db)),full=p=>(p.first+' '+(p.last||'')).trim(),game=id=>db.games.find(g=>g.id===id),record=(g,p)=>db.records.find(r=>r.game===g&&r.player===p),allComp=()=>[...new Set([...baseComp,...db.competitions])];
document.querySelectorAll('[data-p]').forEach(b=>b.onclick=()=>{document.querySelectorAll('.page,.tabs button').forEach(x=>x.classList.remove('active'));$(b.dataset.p).classList.add('active');b.classList.add('active')});function compOptions(sel=''){return '<option value="">Bitte auswählen</option>'+allComp().map(x=>`<option ${x===sel?'selected':''}>${x}</option>`).join('')}function renderCompetitions(){}
function renderGames(){selectedGame.innerHTML='<option value="">Bitte Spiel wählen</option>'+db.games.map(g=>`<option value="${g.id}" ${g.id===current?'selected':''}>${g.id} · ${isoToEu(g.date)} · ${g.opponent}</option>`).join('');gameCards.innerHTML=db.games.map(g=>`<div class="game-card"><b>${g.id} · ${g.opponent}</b><br><small>${isoToEu(g.date)} · ${g.type} · ${g.duration} Min. · ${g.gf}:${g.ga}</small><div class="actions"><button class="btn secondary" onclick="openGame('${g.id}')">Bearbeiten</button><button class="btn danger" onclick="deleteGame('${g.id}')">Löschen</button></div></div>`).join('')||'<div class="card">Noch keine Spiele.</div>'}
function renderCapture(){const g=game(current);gameInfo.textContent=g?`${isoToEu(g.date)} | ${g.opponent} | ${g.duration} Minuten | ${g.gf}:${g.ga}`:'Bitte Spiel auswählen.';playerRows.innerHTML=db.players.filter(p=>p.active).map(p=>{const r=record(current,p.id)||{status:'',minutes:0,goals:0,assists:0,conceded:0,note:''};return `<div class="player ${p.goalkeeper?'is-gk':''}"><div class="ptop"><b>${p.nr} ${full(p)} ${p.goalkeeper?'<span class="pill">TW</span>':''}</b><div class="choices"><label class="choice"><input type="checkbox" data-start="${p.id}" ${r.status==='START'?'checked':''}>START</label><label class="choice"><input type="checkbox" data-bank="${p.id}" ${r.status==='BANK'?'checked':''}>BANK</label></div></div><div class="details"><label>Min.<input data-min="${p.id}" type="number" min="0" value="${r.minutes||0}"></label><label>Tore<input data-goals="${p.id}" type="number" min="0" value="${r.goals||0}"></label><label>Vorlagen<input data-assists="${p.id}" type="number" min="0" value="${r.assists||0}"></label>${p.goalkeeper?`<label class="gkbox">Kassierte Tore<input data-conceded="${p.id}" type="number" min="0" value="${r.conceded||0}"></label>`:''}<label>Bemerkung<input data-note="${p.id}" value="${r.note||''}"></label></div></div>`}).join('');document.querySelectorAll('[data-start]').forEach(x=>x.onchange=()=>toggleStatus(x.dataset.start,'START',x.checked));document.querySelectorAll('[data-bank]').forEach(x=>x.onchange=()=>toggleStatus(x.dataset.bank,'BANK',x.checked));updateStartLimit()}
function toggleStatus(id,type,on){const s=document.querySelector(`[data-start="${id}"]`),b=document.querySelector(`[data-bank="${id}"]`),m=document.querySelector(`[data-min="${id}"]`),g=game(current);if(type==='START'&&on&&document.querySelectorAll('[data-start]:checked').length>11){s.checked=false;alert('Es können maximal 11 Spieler als START aufgestellt werden.');updateStartLimit();return}if(type==='START'&&on){b.checked=false;m.value=g?g.duration:0}else if(type==='BANK'&&on){s.checked=false;m.value=0}else if(!s.checked&&!b.checked)m.value=0;updateStartLimit()}function updateStartLimit(){const checked=document.querySelectorAll('[data-start]:checked').length;startCounter.textContent=`START: ${checked} von 11`;startCounter.classList.toggle('full',checked===11);document.querySelectorAll('[data-start]').forEach(x=>x.disabled=false)}
function renderSquad(){squadTable.innerHTML=db.players.map(p=>`<tr><td>${p.nr}</td><td>${full(p)}</td><td>${p.position||'–'}</td><td>${p.goalkeeper?'Ja':'Nein'}</td><td>${p.active?'Aktiv':'Inaktiv'}</td><td><button class="btn secondary" onclick="openPlayer('${p.id}')">Bearbeiten</button> <button class="btn danger" onclick="deletePlayer('${p.id}')">Löschen</button></td></tr>`).join('')}function getStatsData(){const type=statsType?.value||'ALL',games=db.games.filter(g=>type==='ALL'||g.type===type),ids=new Set(games.map(g=>g.id)),possible=games.reduce((n,g)=>n+(+g.duration||0),0),rows=db.players.map(p=>{const a=db.records.filter(r=>r.player===p.id&&r.status&&ids.has(r.game)),tw=p.goalkeeper?a.filter(r=>+r.minutes>0):[],minutes=a.reduce((n,r)=>n+(+r.minutes||0),0);return{name:full(p),k:a.length,st:a.filter(r=>r.status==='START').length,min:minutes,share:possible?Math.min(100,minutes/possible*100):0,go:a.reduce((n,r)=>n+(+r.goals||0),0),as:a.reduce((n,r)=>n+(+r.assists||0),0),tw:tw.length,con:tw.reduce((n,r)=>n+(+r.conceded||0),0)}});return{type,games,possible,rows}}function renderStats(){const d=getStatsData();statsTable.innerHTML=d.rows.map(p=>`<tr><td>${p.name}</td><td>${p.k}</td><td>${p.st}</td><td>${p.min}</td><td class="share">${p.share.toFixed(1).replace('.',',')} %</td><td>${p.go}</td><td>${p.as}</td><td>${p.tw}</td><td>${p.con}</td></tr>`).join('');kpis.innerHTML=[['Spiele',d.games.length],['Mögliche Minuten',d.possible],['Tore',d.games.reduce((n,g)=>n+(+g.gf||0),0)],['Gegentore',d.games.reduce((n,g)=>n+(+g.ga||0),0)]].map(x=>`<div class="card kpi"><small>${x[0]}</small><br><b>${x[1]}</b></div>`).join('')}function render(){renderGames();renderCapture();renderSquad();renderStats()}
gameForm.onsubmit=e=>{e.preventDefault();const f=new FormData(e.target),id='S'+String(db.games.length+1).padStart(3,'0');db.games.push({id,date:f.get('date'),opponent:f.get('opponent'),venue:f.get('venue'),type:f.get('type'),duration:+f.get('duration'),gf:+f.get('gf'),ga:+f.get('ga')});current=id;persist();e.target.reset();e.target.duration.value=70;render();document.querySelector('[data-p="capture"]').click()};selectedGame.onchange=e=>{current=e.target.value;renderCapture()};
saveCapture.onclick=()=>{if(!current)return alert('Bitte Spiel auswählen.');const starts=document.querySelectorAll('[data-start]:checked').length;if(starts!==11)return alert(`Es müssen genau 11 START-Spieler ausgewählt sein. Aktuell: ${starts}.`);const g=game(current),sumGoals=[...document.querySelectorAll('[data-goals]')].reduce((n,x)=>n+(+x.value||0),0),sumAssists=[...document.querySelectorAll('[data-assists]')].reduce((n,x)=>n+(+x.value||0),0);if(sumGoals>g.gf)return alert(`Spielertore (${sumGoals}) dürfen das Spielergebnis (${g.gf}) nicht überschreiten.`);if(sumAssists>g.gf)return alert(`Vorlagen (${sumAssists}) dürfen die eigenen Tore (${g.gf}) nicht überschreiten.`);const activeGks=db.players.filter(p=>p.active&&p.goalkeeper).map(p=>({p,st:document.querySelector(`[data-start="${p.id}"]`)?.checked,ba:document.querySelector(`[data-bank="${p.id}"]`)?.checked,min:+document.querySelector(`[data-min="${p.id}"]`)?.value||0,con:+document.querySelector(`[data-conceded="${p.id}"]`)?.value||0})).filter(x=>(x.st||x.ba)&&x.min>0),con=activeGks.reduce((n,x)=>n+x.con,0);if(activeGks.length<1)return alert('Mindestens ein als Torwart hinterlegter Spieler muss Einsatzminuten haben.');if(con!==g.ga)return alert(`Die kassierten Tore der eingesetzten Torhüter müssen zusammen ${g.ga} ergeben. Aktuell: ${con}.`);if(!confirm('Spielerdaten wirklich speichern?'))return;db.records=db.records.filter(r=>r.game!==current);db.players.filter(p=>p.active).forEach(p=>{const st=document.querySelector(`[data-start="${p.id}"]`).checked,ba=document.querySelector(`[data-bank="${p.id}"]`).checked,status=st?'START':ba?'BANK':'';if(status)db.records.push({game:current,player:p.id,status,minutes:+document.querySelector(`[data-min="${p.id}"]`).value||0,goals:+document.querySelector(`[data-goals="${p.id}"]`).value||0,assists:+document.querySelector(`[data-assists="${p.id}"]`).value||0,conceded:p.goalkeeper?(+document.querySelector(`[data-conceded="${p.id}"]`)?.value||0):0,note:document.querySelector(`[data-note="${p.id}"]`).value})});persist();renderStats();alert('Gespeichert.')};clearCapture.onclick=()=>{if(confirm('Auswahl leeren?')){document.querySelectorAll('[data-start],[data-bank]').forEach(x=>x.checked=false);document.querySelectorAll('[data-min],[data-goals],[data-assists],[data-conceded]').forEach(x=>x.value=0);updateStartLimit()}};
addPlayerForm.onsubmit=e=>{e.preventDefault();if(!confirm('Spieler hinzufügen?'))return;const f=new FormData(e.target);db.players.push({id:'SP'+Date.now(),nr:+f.get('nr'),first:f.get('first'),last:f.get('last'),position:f.get('position'),goalkeeper:f.get('goalkeeper')==='on',active:true});persist();e.target.reset();render()};window.openPlayer=id=>{const p=db.players.find(x=>x.id===id),f=editPlayerForm.elements;f.id.value=p.id;f.nr.value=p.nr;f.first.value=p.first;f.last.value=p.last;f.position.value=p.position;f.active.value=String(p.active);f.goalkeeper.checked=!!p.goalkeeper;playerModal.classList.add('open')};cancelPlayerEdit.onclick=()=>playerModal.classList.remove('open');editPlayerForm.onsubmit=e=>{e.preventDefault();if(!confirm('Änderungen wirklich übernehmen?'))return;const f=new FormData(e.target),p=db.players.find(x=>x.id===f.get('id'));Object.assign(p,{nr:+f.get('nr'),first:f.get('first'),last:f.get('last'),position:f.get('position'),active:f.get('active')==='true',goalkeeper:f.get('goalkeeper')==='on'});persist();playerModal.classList.remove('open');render()};window.deletePlayer=id=>{const p=db.players.find(x=>x.id===id);if(confirm(`${full(p)} wirklich löschen? Alle Statistikdaten werden ebenfalls gelöscht.`)){db.players=db.players.filter(x=>x.id!==id);db.records=db.records.filter(x=>x.player!==id);persist();render()}};
window.openGame=id=>{const g=game(id),f=editGameForm.elements;Object.keys(g).forEach(k=>{if(f[k])f[k].value=g[k]});f.dateDisplay.value=isoToEu(g.date);gameModal.classList.add('open')};cancelGameEdit.onclick=()=>gameModal.classList.remove('open');editGameForm.onsubmit=e=>{e.preventDefault();if(!confirm('Änderungen wirklich übernehmen?'))return;const f=new FormData(e.target),g=game(f.get('id'));Object.assign(g,{date:f.get('date'),opponent:f.get('opponent'),venue:f.get('venue'),type:f.get('type'),duration:+f.get('duration'),gf:+f.get('gf'),ga:+f.get('ga')});persist();gameModal.classList.remove('open');render()};window.deleteGame=id=>{if(confirm('Spiel und alle Erfassungsdaten löschen?')){db.games=db.games.filter(g=>g.id!==id);db.records=db.records.filter(r=>r.game!==id);if(current===id)current='';persist();render()}};
exportBtn.onclick=()=>{const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify(db,null,2)],{type:'application/json'}));a.download='u15-v7.json';a.click()};importFile.onchange=async e=>{if(confirm('Aktuelle Daten ersetzen?')){db=JSON.parse(await e.target.files[0].text());persist();render()}};resetBtn.onclick=()=>{if(confirm('Wirklich alle Daten löschen?')){localStorage.removeItem('u15-v7');location.reload()}};function liveFor(id){if(!id)return null;if(!db.live[id]){const rs=db.records.filter(r=>r.game===id&&r.status);db.live[id]={elapsed:0,running:false,lastTick:0,ended:false,field:rs.filter(r=>r.status==='START').map(r=>r.player),bench:rs.filter(r=>r.status==='BANK').map(r=>r.player),played:{},entered:{},events:[]};db.live[id].field.forEach(x=>db.live[id].entered[x]=0);persist()}return db.live[id]}function liveElapsed(l){return l?l.elapsed+(l.running?(Date.now()-l.lastTick):0):0}function fmt(ms){const sec=Math.max(0,Math.floor(ms/1000)),m=Math.floor(sec/60),ss=sec%60;return String(m).padStart(2,'0')+':'+String(ss).padStart(2,'0')}function playerMs(l,id){return(l.played[id]||0)+(l.running&&l.field.includes(id)?Date.now()-(l.entered[id]||l.lastTick):0)}function gameOptions(){return '<option value="">Bitte Spiel wählen</option>'+db.games.map(g=>`<option value="${g.id}">${isoToEu(g.date)} · ${g.opponent}</option>`).join('')}function syncLiveSelect(id){subsGame.value=id||'';timelineGame.value=id||'';renderLive()}function renderLive(){const id=subsGame.value||timelineGame.value,l=liveFor(id);if(!l){fieldPlayers.innerHTML=benchPlayers.innerHTML='';eventList.innerHTML='';return}const cards=(ids,where)=>ids.map(id=>{const p=db.players.find(x=>x.id===id);return p?`<div class="live-player ${(where==='field'?selField:selBench)===id?'selected':''}" onclick="selectLive('${where}','${id}')"><b>${p.nr} ${full(p)}</b><span class="timer">${fmt(playerMs(l,id))}</span></div>`:''}).join('');fieldPlayers.innerHTML=cards(l.field,'field');benchPlayers.innerHTML=cards(l.bench,'bench');const all=[...l.field,...l.bench],opts=all.map(id=>{const p=db.players.find(x=>x.id===id);return p?`<option value="${id}">${p.nr} ${full(p)}</option>`:''}).join('');goalScorer.innerHTML='<option value="">Torschütze wählen</option>'+opts;goalAssist.innerHTML='<option value="">Keine Vorlage</option>'+opts;eventList.innerHTML=[...l.events].reverse().map(e=>`<div class="event"><b>${fmt(e.at)}</b> ⚽ ${full(db.players.find(p=>p.id===e.scorer))}${e.assist?' · Vorlage: '+full(db.players.find(p=>p.id===e.assist)):''}</div>`).join('')||'Noch keine Ereignisse.';subsClock.textContent=timelineClock.textContent=fmt(liveElapsed(l));subsStartStop.textContent=timelineStartStop.textContent=l.running?'⏸ Zeit stoppen':'▶ Zeit starten'}window.selectLive=(w,id)=>{if(w==='field')selField=selField===id?'':id;else selBench=selBench===id?'':id;renderLive()};function toggleClock(){const id=subsGame.value||timelineGame.value,l=liveFor(id);if(!l)return alert('Bitte Spiel auswählen.');if(l.ended)return alert('Das Spiel wurde bereits beendet.');if(l.running){const now=Date.now();l.elapsed+=now-l.lastTick;l.field.forEach(x=>{l.played[x]=(l.played[x]||0)+now-(l.entered[x]||l.lastTick)});l.running=false}else{l.running=true;l.lastTick=Date.now();l.field.forEach(x=>l.entered[x]=l.lastTick)}persist();renderLive()}function endMatch(){const id=subsGame.value||timelineGame.value,l=liveFor(id);if(!l)return alert('Bitte Spiel auswählen.');if(!confirm('SPIEL ENDE wirklich bestätigen? Zeit, Wechsel und Verlauf werden gespeichert.'))return;if(l.running)toggleClock();l.ended=true;const g=game(id);Object.entries(l.played).forEach(([pid,ms])=>{let r=record(id,pid);if(!r){r={game:id,player:pid,status:'BANK',minutes:0,goals:0,assists:0,conceded:0,note:''};db.records.push(r)}r.minutes=Math.min(g.duration,Math.round(ms/60000))});l.events.forEach(e=>{let r=record(id,e.scorer);if(r)r.goals=(+r.goals||0)+1;if(e.assist){r=record(id,e.assist);if(r)r.assists=(+r.assists||0)+1}});l.events=[];persist();render();renderLive();alert('Spiel beendet und gespeichert.')}swapPlayers.onclick=()=>{const id=subsGame.value,l=liveFor(id);if(!l||!selField||!selBench)return alert('Bitte einen Spieler vom Feld und einen Spieler von der Bank markieren.');if(!confirm('Ausgewählte Spieler wirklich wechseln?'))return;const now=Date.now();if(l.running){l.played[selField]=(l.played[selField]||0)+now-(l.entered[selField]||l.lastTick);l.entered[selBench]=now}l.field=l.field.filter(x=>x!==selField).concat(selBench);l.bench=l.bench.filter(x=>x!==selBench).concat(selField);selField=selBench='';persist();renderLive()};addGoal.onclick=()=>{const id=timelineGame.value,l=liveFor(id),scorer=goalScorer.value,assist=goalAssist.value,g=game(id);if(!l||!scorer)return alert('Bitte Torschützen auswählen.');if(assist===scorer)return alert('Torschütze und Vorlagengeber müssen verschieden sein.');if(l.events.length>=g.gf)return alert(`Mehr als ${g.gf} eigene Tore sind laut Ergebnis nicht möglich.`);l.events.push({at:liveElapsed(l),scorer,assist});persist();renderLive()};subsStartStop.onclick=timelineStartStop.onclick=toggleClock;subsEnd.onclick=timelineEnd.onclick=endMatch;subsGame.onchange=e=>syncLiveSelect(e.target.value);timelineGame.onchange=e=>syncLiveSelect(e.target.value);statsType.onchange=renderStats;shareStats.onclick=()=>{const d=getStatsData(),title=d.type==='ALL'?'Gesamtübersicht':d.type,lines=[`📊 *U15 Statistik – ${title}*`,`Spiele: ${d.games.length}`,''];d.rows.filter(p=>p.k).forEach(p=>lines.push(`• ${p.name}: ${p.k} Kader | ${p.min} Min. | ${p.share.toFixed(1).replace('.',',')} % | ${p.go} T | ${p.as} V`));window.open('https://wa.me/?text='+encodeURIComponent(lines.join('\n')),'_blank')};document.querySelectorAll('.native-date').forEach(n=>{const d=n.closest('.date-wrap').querySelector('.date-display'),sync=()=>d.value=isoToEu(n.value);n.oninput=n.onchange=sync});const oldRenderGames=renderGames;renderGames=function(){oldRenderGames();subsGame.innerHTML=gameOptions();timelineGame.innerHTML=gameOptions()};setInterval(()=>{const id=subsGame.value||timelineGame.value,l=liveFor(id);if(l?.running)renderLive()},1000);render();renderLive();</script></body></html>
