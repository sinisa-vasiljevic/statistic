:root{--n:#204f7d;--b:#347fca;--g:#16834b;--r:#c43c3c;--bg:#f2f6fa;--line:#d5e0eb;--warn:#fff1c7}*{box-sizing:border-box}body{margin:0;font-family:system-ui,-apple-system,Segoe UI,sans-serif;background:var(--bg);color:#172033}header{background:var(--n);color:#fff;padding:calc(17px + env(safe-area-inset-top)) calc(14px + env(safe-area-inset-right)) 17px calc(14px + env(safe-area-inset-left))}header h1{margin:0;font-size:22px}.wrap{max-width:1150px;margin:auto;padding:10px max(10px,env(safe-area-inset-right)) calc(10px + env(safe-area-inset-bottom)) max(10px,env(safe-area-inset-left))}.tabs{display:flex;gap:7px;overflow:auto;position:sticky;top:0;z-index:8;background:var(--bg);padding:8px 0}.tabs button,.btn{touch-action:manipulation;-webkit-tap-highlight-color:transparent;border:0;border-radius:11px;padding:12px 14px;font-weight:750;cursor:pointer}.tabs button{background:#fff;white-space:nowrap}.tabs button.active,.btn{background:var(--b);color:#fff}.page{display:none}.page.active{display:block}.card{background:#fff;border:1px solid var(--line);border-radius:15px;padding:13px;margin-bottom:12px}.note{background:var(--warn);border:1px solid #e8cc6e;border-radius:11px;padding:10px}.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}.full{grid-column:1/-1}label{font-size:13px;font-weight:700}input,select{width:100%;padding:11px;border:1px solid #c8d4e2;border-radius:10px;font:inherit;margin-top:4px}.date-wrap{position:relative;display:grid;grid-template-columns:1fr 48px;gap:6px;align-items:end}.date-display{margin-top:4px;background:#fff;pointer-events:none}.date-btn{height:44px;padding:0;border:0;border-radius:10px;background:var(--b);color:#fff;font-size:20px;pointer-events:none}.native-date{position:absolute;inset:0;width:100%;height:100%;margin:0;opacity:.001;cursor:pointer;z-index:3;-webkit-appearance:none;appearance:none}.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:11px}.green{background:var(--g)}.danger{background:var(--r)}.gray{background:#667085}.secondary{background:#e7eef6;color:#20344f}.game-select{font-size:18px;font-weight:800;padding:14px;border:2px solid #ddb026;background:#fff9df}.counter{position:sticky;top:65px;z-index:7;padding:10px;background:#e9f5ed;border:1px solid #94c9a7;border-radius:11px;font-weight:800;margin:9px 0}.counter.full{background:#dff2e6;color:#126438}.players{display:grid;grid-template-columns:repeat(2,1fr);gap:9px}.player{border:1px solid var(--line);border-radius:13px;padding:10px}.ptop{display:flex;justify-content:space-between;gap:8px;align-items:center}.choices{display:flex;gap:14px;flex-wrap:wrap;justify-content:flex-end}.choice{display:flex;align-items:center;gap:7px;font-size:16px;font-weight:800;min-height:44px;padding:5px 2px;cursor:pointer;touch-action:manipulation}.choice input{width:30px;height:30px;min-width:30px;margin:0;accent-color:var(--b)}.choice input:disabled{opacity:.28}.details{display:grid;grid-template-columns:repeat(4,minmax(64px,105px)) minmax(150px,1fr);gap:8px;margin-top:8px;align-items:end}.details label{font-size:11px}.details input{padding:8px;max-width:105px}.details label:last-child{min-width:150px}.details label:last-child input{max-width:none}.gkbox{display:none;background:#fff5d9;border-radius:8px;padding:7px}.player.is-gk .gkbox{display:block}.scroll{overflow:auto}table{width:100%;border-collapse:collapse}th,td{padding:9px;border-bottom:1px solid var(--line);text-align:left}th{background:#eaf2fa}.modal{position:fixed;inset:0;background:#17203399;display:none;align-items:center;justify-content:center;padding:14px;z-index:20}.modal.open{display:flex}.modalbox{background:#fff;border-radius:16px;padding:17px;width:min(620px,100%);max-height:90vh;overflow:auto}.game-card{border:1px solid var(--line);border-radius:12px;padding:11px;margin-bottom:8px}.pill{display:inline-block;padding:3px 8px;border-radius:999px;background:#fff0c7;color:#745400;font-size:12px;font-weight:800}.kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}.kpi b{font-size:24px;color:var(--b)}@media(max-width:760px){input,select{font-size:16px}.players,.grid{grid-template-columns:1fr}.full{grid-column:auto}.kpis{grid-template-columns:repeat(2,1fr)}.tabs{margin:0 -10px;padding:8px 10px}.counter{top:64px}.btn{min-height:44px}.details{grid-template-columns:repeat(3,1fr)}table{font-size:13px}}@media(max-width:760px){.details{grid-template-columns:repeat(4,minmax(58px,1fr))}.details label:last-child{grid-column:1/-1;min-width:0}.details label:last-child input{max-width:none}.ptop{align-items:flex-start}.choices{gap:10px}.player{padding:11px 10px}}@media(max-width:420px){.details{grid-template-columns:repeat(2,minmax(70px,1fr))}.details label:last-child{grid-column:1/-1}.ptop{align-items:flex-start;flex-wrap:wrap}.choices{width:100%;justify-content:flex-start}}
</style></head><body><header><h1>VfR Heilbronn U15 Statistik</h1><small>Version 7.2</small></header><div class="wrap"><nav class="tabs"><button class="active" data-p="games">Spiele</button><button data-p="capture">Spielerfassung</button><button data-p="stats">Statistik</button><button data-p="squad">Spieler</button><button data-p="backup">Sicherung</button></nav>
<section id="games" class="page active"><div class="card"><h2>Spiel anlegen</h2><form id="gameForm" class="grid"><label>Datum<div class="date-wrap"><input class="date-display" type="text" name="dateDisplay" placeholder="TT.MM.JJJJ" readonly required><button type="button" class="date-btn" aria-label="Kalender öffnen">📅</button><input class="native-date" id="gameDateNative" type="date" name="date" required></div></label><label>Gegner<input name="opponent" required></label><label>Ort<select name="venue"><option>Heim</option><option>Auswärts</option><option>Neutral</option></select></label><label>Spielart<select name="type"><option>Liga</option><option>Testspiel</option><option>Turnier</option><option>Pokal</option></select></label><label>Wettbewerb<select name="competition" id="competitionSelect" required></select></label><label>Spieldauer<input type="number" name="duration" value="70" min="1" required></label><label>Tore VfR<input type="number" name="gf" value="0" min="0"></label><label>Gegentore<input type="number" name="ga" value="0" min="0"></label><div class="full actions"><button class="btn">Spiel speichern</button><button type="button" id="manageCompetitions" class="btn secondary">Wettbewerbe verwalten</button></div></form></div><div id="gameCards"></div></section>
<section id="capture" class="page"><div class="card"><label>Spiel auswählen<select id="selectedGame" class="game-select"></select></label><div id="gameInfo"></div><div id="startCounter" class="counter">START: 0 von 11</div><div id="playerRows" class="players"></div><div class="actions"><button id="saveCapture" class="btn green">Spielerdaten speichern</button><button id="clearCapture" class="btn gray">Auswahl leeren</button></div></div></section>
<section id="stats" class="page"><div id="kpis" class="kpis"></div><div class="card scroll"><table><thead><tr><th>Spieler</th><th>Kader</th><th>Start</th><th>Min.</th><th>Tore</th><th>Vorlagen</th><th>TW-Einsätze</th><th>Gegentore</th></tr></thead><tbody id="statsTable"></tbody></table></div></section>
<section id="squad" class="page"><div class="card"><h2>Spieler hinzufügen</h2><form id="addPlayerForm" class="grid"><label>Nr.<input name="nr" type="number" required></label><label>Vorname<input name="first" required></label><label>Nachname<input name="last"></label><label>Position<input name="position"></label><label><input name="goalkeeper" type="checkbox" style="width:auto"> Torwart</label><div class="full"><button class="btn">Hinzufügen</button></div></form></div><div class="card scroll"><table><thead><tr><th>Nr.</th><th>Name</th><th>Position</th><th>Torwart</th><th>Status</th><th>Aktionen</th></tr></thead><tbody id="squadTable"></tbody></table></div></section>
<section id="backup" class="page"><div class="card actions"><button id="exportBtn" class="btn">Exportieren</button><label class="btn">Importieren<input id="importFile" hidden type="file"></label><button id="resetBtn" class="btn danger">Alles zurücksetzen</button></div></section></div>
<div id="playerModal" class="modal"><div class="modalbox"><h3>Spieler bearbeiten</h3><form id="editPlayerForm" class="grid"><input name="id" type="hidden"><label>Nr.<input name="nr" type="number" required></label><label>Vorname<input name="first" required></label><label>Nachname<input name="last"></label><label>Position<input name="position"></label><label>Status<select name="active"><option value="true">Aktiv</option><option value="false">Inaktiv</option></select></label><label><input name="goalkeeper" type="checkbox" style="width:auto"> Torwart</label><div class="full actions"><button class="btn green">Übernehmen</button><button type="button" id="cancelPlayerEdit" class="btn gray">Abbrechen</button></div></form></div></div>
<div id="gameModal" class="modal"><div class="modalbox"><h3>Spiel bearbeiten</h3><form id="editGameForm" class="grid"><input name="id" type="hidden"><label>Datum<div class="date-wrap"><input class="date-display" type="text" name="dateDisplay" placeholder="TT.MM.JJJJ" readonly required><button type="button" class="date-btn" aria-label="Kalender öffnen">📅</button><input class="native-date" id="editGameDateNative" name="date" type="date" required></div></label><label>Gegner<input name="opponent" required></label><label>Ort<select name="venue"><option>Heim</option><option>Auswärts</option><option>Neutral</option></select></label><label>Spielart<select name="type"><option>Liga</option><option>Testspiel</option><option>Turnier</option><option>Pokal</option></select></label><label>Wettbewerb<select name="competition"></select></label><label>Spieldauer<input name="duration" type="number" min="1"></label><label>Tore VfR<input name="gf" type="number" min="0"></label><label>Gegentore<input name="ga" type="number" min="0"></label><div class="full actions"><button class="btn green">Übernehmen</button><button type="button" id="cancelGameEdit" class="btn gray">Abbrechen</button></div></form></div></div>
<div id="competitionModal" class="modal"><div class="modalbox"><h3>Eigene Wettbewerbe</h3><form id="competitionForm" class="grid"><input name="name" required><button class="btn">Hinzufügen</button></form><div id="competitionList"></div><button id="closeCompetitions" class="btn gray">Schließen</button></div></div>
<script>'use strict';const $=id=>document.getElementById(id),baseComp=['Oberliga Baden-Württemberg','Verbandspokal','Bezirkspokal','Turnier','Testspiel','Sonstiges'];const raw=[['Nico','Lautenbach',1,'TW',1],['Dominik','Wojtysiak',12,'',0],['Kristian','Wagner',22,'TW',1],['Raphael','Alvelos',2,'',0],['Maik','Tatou',3,'',0],['Mats','Weinreuther',4,'IV',0],['Dino','Hasic',5,'ZM/IV',0],['Tan','Turhan',6,'RV/ZM',0],['David','Vasiljevic',7,'LF',0],['Arda','Budak',8,'RF',0],['Antonio','Sica',9,'MS',0],['Luis','Zimmermann',10,'ZM',0],['Berkay','',11,'ZM',0],['Lasisi','Victor',13,'MS',0],['Luca','',14,'ZM',0],['Tuna','Seklem',15,'LV',0],['Kelvin','Rohleder',16,'ZM',0],['Erdem','Uzunok',17,'',0],['Eric','Serjanaj',18,'ZM',0],['Leo','Llukaci',19,'MS',0],['Viktor','Averkin',20,'IV',0],['Semin','Hasic',21,'',0],['Burak','Korkmaz',23,'',0],['Lenny','Detaro',24,'',0]];const seed=raw.map((x,i)=>({id:'SP'+String(i+1).padStart(3,'0'),first:x[0],last:x[1],nr:x[2],position:x[3],goalkeeper:!!x[4],active:true}));let db=JSON.parse(localStorage.getItem('u15-v7')||'null')||{players:seed,games:[],records:[],competitions:[]};db.competitions=db.competitions||[];let current='';const isoToEu=v=>{if(!/^\d{4}-\d{2}-\d{2}$/.test(v||''))return v||'';const [y,m,d]=v.split('-');return `${d}.${m}.${y}`};const persist=()=>localStorage.setItem('u15-v7',JSON.stringify(db)),full=p=>(p.first+' '+(p.last||'')).trim(),game=id=>db.games.find(g=>g.id===id),record=(g,p)=>db.records.find(r=>r.game===g&&r.player===p),allComp=()=>[...new Set([...baseComp,...db.competitions])];
document.querySelectorAll('[data-p]').forEach(b=>b.onclick=()=>{document.querySelectorAll('.page,.tabs button').forEach(x=>x.classList.remove('active'));$(b.dataset.p).classList.add('active');b.classList.add('active')});function compOptions(sel=''){return '<option value="">Bitte auswählen</option>'+allComp().map(x=>`<option ${x===sel?'selected':''}>${x}</option>`).join('')}function renderCompetitions(){competitionSelect.innerHTML=compOptions();editGameForm.elements.competition.innerHTML=compOptions();competitionList.innerHTML=db.competitions.map(c=>`<p>${c} <button class="btn danger" onclick="removeCompetition('${encodeURIComponent(c)}')">Entfernen</button></p>`).join('')||'<p>Keine eigenen Einträge.</p>'}
function renderGames(){selectedGame.innerHTML='<option value="">Bitte Spiel wählen</option>'+db.games.map(g=>`<option value="${g.id}" ${g.id===current?'selected':''}>${g.id} · ${isoToEu(g.date)} · ${g.opponent}</option>`).join('');gameCards.innerHTML=db.games.map(g=>`<div class="game-card"><b>${g.id} · ${g.opponent}</b><br><small>${isoToEu(g.date)} · ${g.competition} · ${g.duration} Min. · ${g.gf}:${g.ga}</small><div class="actions"><button class="btn secondary" onclick="openGame('${g.id}')">Bearbeiten</button><button class="btn danger" onclick="deleteGame('${g.id}')">Löschen</button></div></div>`).join('')||'<div class="card">Noch keine Spiele.</div>'}
function renderCapture(){const g=game(current);gameInfo.textContent=g?`${isoToEu(g.date)} | ${g.opponent} | ${g.duration} Minuten | ${g.gf}:${g.ga}`:'Bitte Spiel auswählen.';playerRows.innerHTML=db.players.filter(p=>p.active).map(p=>{const r=record(current,p.id)||{status:'',minutes:0,goals:0,assists:0,conceded:0,note:''};return `<div class="player ${p.goalkeeper?'is-gk':''}"><div class="ptop"><b>${p.nr} ${full(p)} ${p.goalkeeper?'<span class="pill">TW</span>':''}</b><div class="choices"><label class="choice"><input type="checkbox" data-start="${p.id}" ${r.status==='START'?'checked':''}>START</label><label class="choice"><input type="checkbox" data-bank="${p.id}" ${r.status==='BANK'?'checked':''}>BANK</label></div></div><div class="details"><label>Min.<input data-min="${p.id}" type="number" min="0" value="${r.minutes||0}"></label><label>Tore<input data-goals="${p.id}" type="number" min="0" value="${r.goals||0}"></label><label>Vorlagen<input data-assists="${p.id}" type="number" min="0" value="${r.assists||0}"></label>${p.goalkeeper?`<label class="gkbox">Kassierte Tore<input data-conceded="${p.id}" type="number" min="0" value="${r.conceded||0}"></label>`:''}<label>Bemerkung<input data-note="${p.id}" value="${r.note||''}"></label></div></div>`}).join('');document.querySelectorAll('[data-start]').forEach(x=>x.onchange=()=>toggleStatus(x.dataset.start,'START',x.checked));document.querySelectorAll('[data-bank]').forEach(x=>x.onchange=()=>toggleStatus(x.dataset.bank,'BANK',x.checked));updateStartLimit()}
function toggleStatus(id,type,on){const s=document.querySelector(`[data-start="${id}"]`),b=document.querySelector(`[data-bank="${id}"]`),m=document.querySelector(`[data-min="${id}"]`),g=game(current);if(type==='START'&&on&&document.querySelectorAll('[data-start]:checked').length>11){s.checked=false;alert('Es können maximal 11 Spieler als START aufgestellt werden.');updateStartLimit();return}if(type==='START'&&on){b.checked=false;m.value=g?g.duration:0}else if(type==='BANK'&&on){s.checked=false;m.value=0}else if(!s.checked&&!b.checked)m.value=0;updateStartLimit()}function updateStartLimit(){const checked=document.querySelectorAll('[data-start]:checked').length;startCounter.textContent=`START: ${checked} von 11`;startCounter.classList.toggle('full',checked===11);document.querySelectorAll('[data-start]').forEach(x=>x.disabled=false)}
function renderSquad(){squadTable.innerHTML=db.players.map(p=>`<tr><td>${p.nr}</td><td>${full(p)}</td><td>${p.position||'–'}</td><td>${p.goalkeeper?'Ja':'Nein'}</td><td>${p.active?'Aktiv':'Inaktiv'}</td><td><button class="btn secondary" onclick="openPlayer('${p.id}')">Bearbeiten</button> <button class="btn danger" onclick="deletePlayer('${p.id}')">Löschen</button></td></tr>`).join('')}function renderStats(){const s=db.players.map(p=>{const a=db.records.filter(r=>r.player===p.id&&r.status),tw=p.goalkeeper?a.filter(r=>+r.minutes>0):[],con=tw.reduce((n,r)=>n+(+r.conceded||0),0);return{name:full(p),k:a.length,st:a.filter(r=>r.status==='START').length,min:a.reduce((n,r)=>n+(+r.minutes||0),0),go:a.reduce((n,r)=>n+(+r.goals||0),0),as:a.reduce((n,r)=>n+(+r.assists||0),0),tw:tw.length,con}});statsTable.innerHTML=s.map(p=>`<tr><td>${p.name}</td><td>${p.k}</td><td>${p.st}</td><td>${p.min}</td><td>${p.go}</td><td>${p.as}</td><td>${p.tw}</td><td>${p.con}</td></tr>`).join('');kpis.innerHTML=[['Spiele',db.games.length],['Aktive Spieler',db.players.filter(p=>p.active).length],['Tore',db.games.reduce((n,g)=>n+g.gf,0)],['Gegentore',db.games.reduce((n,g)=>n+g.ga,0)]].map(x=>`<div class="card kpi"><small>${x[0]}</small><br><b>${x[1]}</b></div>`).join('')}function render(){renderCompetitions();renderGames();renderCapture();renderSquad();renderStats()}
gameForm.onsubmit=e=>{e.preventDefault();const f=new FormData(e.target),id='S'+String(db.games.length+1).padStart(3,'0');db.games.push({id,date:f.get('date'),opponent:f.get('opponent'),venue:f.get('venue'),type:f.get('type'),competition:f.get('competition'),duration:+f.get('duration'),gf:+f.get('gf'),ga:+f.get('ga')});current=id;persist();e.target.reset();e.target.duration.value=70;render();document.querySelector('[data-p="capture"]').click()};selectedGame.onchange=e=>{current=e.target.value;renderCapture()};
saveCapture.onclick=()=>{if(!current)return alert('Bitte Spiel auswählen.');const starts=document.querySelectorAll('[data-start]:checked').length;if(starts!==11)return alert(`Es müssen genau 11 START-Spieler ausgewählt sein. Aktuell: ${starts}.`);const g=game(current),activeGks=db.players.filter(p=>p.active&&p.goalkeeper).map(p=>({p,st:document.querySelector(`[data-start="${p.id}"]`)?.checked,ba:document.querySelector(`[data-bank="${p.id}"]`)?.checked,min:+document.querySelector(`[data-min="${p.id}"]`)?.value||0,con:+document.querySelector(`[data-conceded="${p.id}"]`)?.value||0})).filter(x=>(x.st||x.ba)&&x.min>0),con=activeGks.reduce((n,x)=>n+x.con,0);if(activeGks.length<1)return alert('Mindestens ein als Torwart hinterlegter Spieler muss Einsatzminuten haben.');if(con!==g.ga)return alert(`Die kassierten Tore der eingesetzten Torhüter müssen zusammen ${g.ga} ergeben. Aktuell: ${con}.`);if(!confirm('Spielerdaten wirklich speichern?'))return;db.records=db.records.filter(r=>r.game!==current);db.players.filter(p=>p.active).forEach(p=>{const st=document.querySelector(`[data-start="${p.id}"]`).checked,ba=document.querySelector(`[data-bank="${p.id}"]`).checked,status=st?'START':ba?'BANK':'';if(status)db.records.push({game:current,player:p.id,status,minutes:+document.querySelector(`[data-min="${p.id}"]`).value||0,goals:+document.querySelector(`[data-goals="${p.id}"]`).value||0,assists:+document.querySelector(`[data-assists="${p.id}"]`).value||0,conceded:p.goalkeeper?(+document.querySelector(`[data-conceded="${p.id}"]`)?.value||0):0,note:document.querySelector(`[data-note="${p.id}"]`).value})});persist();renderStats();alert('Gespeichert.')};clearCapture.onclick=()=>{if(confirm('Auswahl leeren?')){document.querySelectorAll('[data-start],[data-bank]').forEach(x=>x.checked=false);document.querySelectorAll('[data-min],[data-goals],[data-assists],[data-conceded]').forEach(x=>x.value=0);updateStartLimit()}};
addPlayerForm.onsubmit=e=>{e.preventDefault();if(!confirm('Spieler hinzufügen?'))return;const f=new FormData(e.target);db.players.push({id:'SP'+Date.now(),nr:+f.get('nr'),first:f.get('first'),last:f.get('last'),position:f.get('position'),goalkeeper:f.get('goalkeeper')==='on',active:true});persist();e.target.reset();render()};window.openPlayer=id=>{const p=db.players.find(x=>x.id===id),f=editPlayerForm.elements;f.id.value=p.id;f.nr.value=p.nr;f.first.value=p.first;f.last.value=p.last;f.position.value=p.position;f.active.value=String(p.active);f.goalkeeper.checked=!!p.goalkeeper;playerModal.classList.add('open')};cancelPlayerEdit.onclick=()=>playerModal.classList.remove('open');editPlayerForm.onsubmit=e=>{e.preventDefault();if(!confirm('Änderungen wirklich übernehmen?'))return;const f=new FormData(e.target),p=db.players.find(x=>x.id===f.get('id'));Object.assign(p,{nr:+f.get('nr'),first:f.get('first'),last:f.get('last'),position:f.get('position'),active:f.get('active')==='true',goalkeeper:f.get('goalkeeper')==='on'});persist();playerModal.classList.remove('open');render()};window.deletePlayer=id=>{const p=db.players.find(x=>x.id===id);if(confirm(`${full(p)} wirklich löschen? Alle Statistikdaten werden ebenfalls gelöscht.`)){db.players=db.players.filter(x=>x.id!==id);db.records=db.records.filter(x=>x.player!==id);persist();render()}};
window.openGame=id=>{const g=game(id),f=editGameForm.elements;f.competition.innerHTML=compOptions(g.competition);Object.keys(g).forEach(k=>{if(f[k])f[k].value=g[k]});f.dateDisplay.value=isoToEu(g.date);gameModal.classList.add('open')};cancelGameEdit.onclick=()=>gameModal.classList.remove('open');editGameForm.onsubmit=e=>{e.preventDefault();if(!confirm('Änderungen wirklich übernehmen?'))return;const f=new FormData(e.target),g=game(f.get('id'));Object.assign(g,{date:f.get('date'),opponent:f.get('opponent'),venue:f.get('venue'),type:f.get('type'),competition:f.get('competition'),duration:+f.get('duration'),gf:+f.get('gf'),ga:+f.get('ga')});persist();gameModal.classList.remove('open');render()};window.deleteGame=id=>{if(confirm('Spiel und alle Erfassungsdaten löschen?')){db.games=db.games.filter(g=>g.id!==id);db.records=db.records.filter(r=>r.game!==id);if(current===id)current='';persist();render()}};
manageCompetitions.onclick=()=>competitionModal.classList.add('open');closeCompetitions.onclick=()=>competitionModal.classList.remove('open');competitionForm.onsubmit=e=>{e.preventDefault();const c=new FormData(e.target).get('name').trim();if(c&&!allComp().includes(c)){db.competitions.push(c);persist();renderCompetitions()}e.target.reset()};window.removeCompetition=x=>{x=decodeURIComponent(x);if(db.games.some(g=>g.competition===x))return alert('Wettbewerb wird verwendet.');if(confirm(`${x} entfernen?`)){db.competitions=db.competitions.filter(c=>c!==x);persist();renderCompetitions()}};exportBtn.onclick=()=>{const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify(db,null,2)],{type:'application/json'}));a.download='u15-v7.json';a.click()};importFile.onchange=async e=>{if(confirm('Aktuelle Daten ersetzen?')){db=JSON.parse(await e.target.files[0].text());persist();render()}};resetBtn.onclick=()=>{if(confirm('Wirklich alle Daten löschen?')){localStorage.removeItem('u15-v7');location.reload()}};document.querySelectorAll('.native-date').forEach(native=>{const display=native.closest('.date-wrap').querySelector('.date-display');const sync=()=>display.value=isoToEu(native.value);native.addEventListener('input',sync);native.addEventListener('change',sync)});render();</script></body></html>
